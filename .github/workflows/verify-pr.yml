name: PR Verification Harness
on:
  pull_request_target:
    types: [labeled, synchronize]
    paths-ignore: ['docs/**', '**/*.md']

# v6 single-round model: recipe is authored AND executed in the same workflow
# run. The authored spec is materialised straight into the untrusted PR-head
# workspace ($RUNNER_TEMP/pr-head/.verify-recipes/pr-<#>.spec.ts) — never
# committed. See scripts/verify/SECURITY.md for the load-bearing controls.

jobs:
  verify:
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:verify')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      issues: write
      statuses: write
      contents: write   # needed to push screenshots to the _verify-screenshots side branch
    steps:
      - name: Check actor permission
        uses: prince-chrismc/check-actor-permissions-action@d504e74ba31658f4cdf4fcfeb509d4c09736d88e # v3.0.2
        with:
          permission: write
      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # see RUNBOOK.md §base-checkout-ref-pinning
          ref: ${{ github.event.pull_request.base.ref }}
          # Do not persist the actions/checkout token into .git/config — keeps
          # GITHUB_TOKEN out of any subprocess that subsequently runs `git`
          # inside the workspace (untrusted yarn install / nx compile scripts).
          persist-credentials: false
      - name: Scrub any residual checkout credentials
        # Belt-and-suspenders for persist-credentials:false — if the base
        # checkout ever wrote an Authorization header into .git/config under
        # an old runner image, drop it now before any untrusted code runs.
        run: |
          git config --unset-all http.https://github.com/.extraheader || true
      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Compute paths
        # Export PR_HEAD_DIR via $GITHUB_ENV so every subsequent step can
        # reference $PR_HEAD_DIR (shell) or ${{ env.PR_HEAD_DIR }} (YAML).
        # ${{ runner.temp }} is only valid in step contexts, not at job-env
        # level — this is the canonical workaround.
        run: echo "PR_HEAD_DIR=${{ runner.temp }}/pr-head" >> "$GITHUB_ENV"

      - name: Checkout PR head (untrusted execution context)
        # Manual git clone instead of actions/checkout because the repo carries
        # gitlinks (.external/addon-svelte-csf etc.) without a .gitmodules file,
        # which breaks actions/checkout's submodule-foreach cleanup pass under
        # persist-credentials: false. The manual clone never writes auth into
        # pr-head/.git, preserving the same security posture as
        # persist-credentials: false.
        #
        # Cloning into $RUNNER_TEMP (outside the base checkout tree) so that
        # nx / yarn / jiti module resolution inside pr-head never walks up
        # into the base checkout's node_modules — that escape was the round-3
        # / round-4 failure mode (eslint-plugin prebuild resolved
        # `storybook/csf` to the base copy, which has no `dist/csf` yet).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git -c protocol.version=2 clone \
            --no-tags --no-checkout --filter=blob:none \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" \
            "$PR_HEAD_DIR"
          cd "$PR_HEAD_DIR"
          # Fetch both the PR-head SHA and the base SHA so we can compute a
          # stable diff pinned to the event payload (UX2). Without the base
          # SHA available locally, `git diff $BASE_SHA $PR_HEAD_SHA` would
          # fall back to network resolution.
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --force "$PR_HEAD_SHA"
          git remote set-url origin "https://github.com/${REPO}.git"
          git config --local --unset-all credential.helper 2>/dev/null || true

      - name: Fetch PR diff
        # UX2: compute diff against the event-payload SHAs rather than the
        # latest `gh pr diff <number>` (which races the PR mid-update).
        # M1: write to $RUNNER_TEMP, not /tmp — /tmp is in srt allowWrite so
        # an untrusted recipe could corrupt the diff between steps.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git -C "$PR_HEAD_DIR" diff "$BASE_SHA" "$PR_HEAD_SHA" > "$RUNNER_TEMP/pr.diff"

      - name: Generate bundle
        # Trusted scripts (base checkout) read trusted authoring-guide +
        # canonical smoke + triage rules from the base. The bundle's
        # outputSpecPath is set to the ephemeral PR-head path so the Author
        # step writes the recipe straight into the untrusted workspace.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # UX2: pin the diff to the event-payload SHAs via the new flags
          # w4 added to verify-pr-generate. Eliminates the race window where
          # `gh pr diff <num>` would return a newer PR head than the workflow
          # is actually evaluating.
          yarn verify-pr-generate \
            --pr "$PR_NUMBER" \
            --force \
            --base-sha "$BASE_SHA" \
            --head-sha "$PR_HEAD_SHA" \
            --output "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts"

      - name: Author recipe
        # ANTHROPIC_API_KEY is scoped to THIS step only. The Verify step that
        # executes the authored spec has no API key. Static deny-regex +
        # scoped lint inside recipe-author-core gate what lands on disk.
        run: |
          # shellcheck disable=SC2012
          BUNDLE=$(ls -t .verify-output/*/prompt-bundle.json | head -1)
          yarn verify-pr-author --bundle "$BUNDLE"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Sync trusted .verify-recipes helpers into PR head
        # The authored spec imports `./_util.ts` (which re-exports `expect`
        # + a `test` extended with the auto-failure-capture fixture). The
        # PR-head checkout has a copy of `_util.ts` at the SHA the PR
        # branched from, which lags behind the base branch's harness
        # iteration. Always overwrite with the base-branch version so the
        # spec runs against the current util contract. example-smoke.spec.ts
        # is copied alongside so reference recipes stay aligned.
        run: |
          set -euo pipefail
          mkdir -p "$PR_HEAD_DIR/.verify-recipes"
          # Refuse symlinks at the destination — a malicious PR-head could
          # plant a symlink there pointing at $HOME/.ssh, which our `cp`
          # would happily follow without --no-dereference.
          for f in _util.ts example-smoke.spec.ts; do
            dest="$PR_HEAD_DIR/.verify-recipes/$f"
            if [ -L "$dest" ]; then
              echo "[sync] refusing to overwrite symlink at $dest" >&2
              exit 1
            fi
            cp --no-dereference --remove-destination ".verify-recipes/$f" "$dest"
          done

      - name: Install sandbox-runtime (Layer-2)
        # see RUNBOOK.md §sandbox-runtime-layer-2
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          # Pin to an exact version so a malicious upstream release cannot
          # quietly land in CI. `--ignore-scripts` prevents the upstream
          # tarball from running postinstall hooks under sudo. Bump
          # procedure: see scripts/verify/SECURITY.md §pinning-sandbox-runtime.
          sudo npm install -g --ignore-scripts @anthropic-ai/sandbox-runtime@0.0.51
          srt --version
          # Post-install integrity check. EXPECTED_SRT_SHA is the sha256 of
          # the resolved `srt` shim at the pinned version above. Bump
          # procedure: see scripts/verify/SECURITY.md §pinning-sandbox-runtime.
          # FAIL-CLOSED: pinned sha256 of the srt shim at the version above.
          # Bump procedure: re-run .github/workflows/_srt-sha-probe.yml after
          # bumping the srt version and paste the value emitted by the probe
          # job into the literal below.
          EXPECTED_SRT_SHA="36de38197ac22991c8c9edead4d6184914c8b786e040ecf27bdcf26abd166338"
          actual=$(sha256sum "$(which srt)" | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED_SRT_SHA" ]; then
            echo "srt sha mismatch — expected=$EXPECTED_SRT_SHA actual=$actual" >&2
            exit 1
          fi
          echo "[srt] sha verified: $actual"

      - name: Build sandbox settings
        # see RUNBOOK.md §srt-sandbox-settings
        run: |
          set -euo pipefail
          SANDBOX_TMPDIR="$RUNNER_TEMP/sandbox-tmp"
          mkdir -p "$SANDBOX_TMPDIR"
          # Narrow scratch path replaces $RUNNER_TEMP from allowWrite — the
          # PR-head workspace + ephemeral .verify-output now share a single
          # writable subtree under $PR_HEAD_DIR. Result-file path is
          # exported via $GITHUB_OUTPUT (see Verify PR step) so downstream
          # steps don't `ls -t` arbitrary subdirs.
          mkdir -p "$PR_HEAD_DIR/.verify-scratch"
          mkdir -p "$PR_HEAD_DIR/.verify-out-trusted"
          mkdir -p "$HOME/.storybook"
          cat > "$RUNNER_TEMP/srt-settings.json" <<JSON
          {
            "network": {
              "allowLocalBinding": true,
              "allowedDomains": ["localhost", "127.0.0.1"],
              "deniedDomains": ["*"]
            },
            "filesystem": {
              "allowRead": [],
              "allowWrite": [
                "$PR_HEAD_DIR",
                "$SANDBOX_TMPDIR",
                "/tmp",
                "$HOME/.cache",
                "$HOME/.local/share",
                "$HOME/.storybook"
              ],
              "denyRead": [
                "$HOME/.ssh",
                "$HOME/.aws",
                "$HOME/.docker",
                "$HOME/.npmrc",
                "$HOME/.gitconfig",
                "$HOME/.config/gh",
                "$GITHUB_WORKSPACE/.git"
              ],
              "denyWrite": [
                "$GITHUB_WORKSPACE",
                "$GITHUB_WORKSPACE/.git"
              ]
            }
          }
          JSON
          echo "SRT_SETTINGS=$RUNNER_TEMP/srt-settings.json" >> "$GITHUB_ENV"
          echo "CLAUDE_CODE_TMPDIR=$SANDBOX_TMPDIR" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/srt-settings.json"

      - name: Smoke-test srt egress policy
        # Fail-closed sanity check: if the jail config drifts and lets
        # arbitrary domains through, this step trips immediately rather
        # than waiting for a malicious recipe to exfil during Verify PR.
        # We expect the curl to fail (non-zero exit) because example.com
        # is not in allowedDomains; if it succeeds, the policy is broken.
        run: |
          set -uo pipefail
          if srt --settings "$SRT_SETTINGS" curl --max-time 5 https://example.com >/dev/null 2>&1; then
            echo "[smoke] EGRESS POLICY BROKEN — example.com reachable inside srt" >&2
            exit 1
          fi
          echo "[smoke] egress correctly denied"

      - name: Verify PR
        id: verify
        working-directory: ${{ runner.temp }}/pr-head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # see RUNBOOK.md §nx-no-cloud-rationale
          NX_NO_CLOUD: 'true'
          NX_CLOUD_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          # see RUNBOOK.md §verify-pr-secret-stripping
          # C3: extend unset to cover the telemetry webhook + every actions
          # token shape the runner may inject, in addition to the existing
          # GITHUB / ANTHROPIC keys.
          unset GITHUB_TOKEN GH_TOKEN ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN \
                ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RESULTS_URL ACTIONS_CACHE_URL \
                TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_URL \
                TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_TOKEN
          # UX1: redirect $GITHUB_ENV / $GITHUB_PATH / $GITHUB_OUTPUT to
          # throwaway files inside $RUNNER_TEMP so an untrusted install /
          # compile script can't poison subsequent steps by writing
          # `FOO=evil` into the runner's real $GITHUB_ENV.
          SINK_DIR="$RUNNER_TEMP/sink"
          mkdir -p "$SINK_DIR"
          SINK_GITHUB_ENV="$SINK_DIR/github_env"
          SINK_GITHUB_PATH="$SINK_DIR/github_path"
          SINK_GITHUB_OUTPUT="$SINK_DIR/github_output"
          : > "$SINK_GITHUB_ENV"
          : > "$SINK_GITHUB_PATH"
          : > "$SINK_GITHUB_OUTPUT"
          # Disable postinstall lifecycle scripts in the PR-head workspace —
          # malicious package.json `postinstall` hooks would otherwise run
          # under yarn install before srt wraps anything. The override is a
          # local .yarnrc.yml fragment merged with the head's own config;
          # `enableScripts: false` is the documented Yarn Berry knob.
          cat > "$PR_HEAD_DIR/.yarnrc.override.yml" <<'YRC'
          enableScripts: false
          YRC
          # Loosened FS allowlist for install/compile: yarn pulls from the
          # global cache (~/.cache/yarn) and playwright writes its binary
          # under ~/.cache/ms-playwright. Both are already covered by the
          # $HOME/.cache entry in allowWrite; we explicitly mention them
          # in this comment so future hardening passes don't try to remove
          # the parent without restoring per-tool subpaths.
          # srt-wrapped install: env -i strips every non-allowlisted var so
          # ACTIONS_* tokens cannot leak even if `unset` is bypassed by
          # subshell quoting. Keep the explicit allowlist narrow.
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            NX_NO_CLOUD=true \
            PR_HEAD_DIR="$PR_HEAD_DIR" \
            GITHUB_ENV="$SINK_GITHUB_ENV" \
            GITHUB_PATH="$SINK_GITHUB_PATH" \
            GITHUB_OUTPUT="$SINK_GITHUB_OUTPUT" \
            YARN_RC_FILENAME="$PR_HEAD_DIR/.yarnrc.override.yml" \
            srt --settings "$SRT_SETTINGS" \
            yarn install --immutable
          # Playwright browser binaries. Same srt wrap + env scrubbing.
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            NX_NO_CLOUD=true \
            PR_HEAD_DIR="$PR_HEAD_DIR" \
            GITHUB_ENV="$SINK_GITHUB_ENV" \
            GITHUB_PATH="$SINK_GITHUB_PATH" \
            GITHUB_OUTPUT="$SINK_GITHUB_OUTPUT" \
            srt --settings "$SRT_SETTINGS" \
            yarn playwright install --with-deps chromium

          # Trusted output path used both by the compile-failure stub and the
          # main verify-pr invocation. Threaded to downstream steps via
          # $GITHUB_OUTPUT so they can consume ${{ steps.verify.outputs.result-path }}
          # instead of globbing the PR-writable .verify-output tree.
          VERIFY_RESULT_PATH="$PR_HEAD_DIR/.verify-out-trusted/verify-result.json"
          export VERIFY_RESULT_PATH
          STUB_OUT_DIR="$(dirname "$VERIFY_RESULT_PATH")"
          mkdir -p "$STUB_OUT_DIR"
          echo "result-path=$VERIFY_RESULT_PATH" >> "$GITHUB_OUTPUT"

          # Stub a regression verdict if compile fails. Without this, the
          # workflow short-circuits before verify-result.json is written and
          # the PR comment shows "No verdict produced" — confusing for cases
          # like PR #15 where the upstream PR genuinely doesn't compile.
          # Implementation lives in scripts/verify/ci/write-compile-failure-stub.ts
          # so the schema stays single-sourced via writeRegressionResult.
          write_compile_failure_stub() {
            local log="$1"
            node "$GITHUB_WORKSPACE/scripts/verify/ci/write-compile-failure-stub.ts" \
              --log "$log" \
              --out-dir "$STUB_OUT_DIR" \
              --template "internal-ui"
          }
          COMPILE_LOG="$RUNNER_TEMP/verify-compile.log"
          # Pick the prep path based on the recipe's @verify-target header.
          # internal-ui: needs `nx compile core` (so `code/core/dist/bin/
          # dispatcher.js` exists for bootInternalUi) plus the rest of the
          # workspace compiled so the dev server can resolve every addon /
          # framework `code/.storybook/main.ts` imports.
          # sandbox:<tpl>: `nx run <tpl>:sandbox` handles all compile deps
          # via the project's implicitDependencies + emits the sandbox dir
          # at `code/sandbox/<key>` (verify-pr's resolveSandboxDir checks
          # this path before falling through to `../storybook-sandboxes`).
          # `yarn task sandbox` is the legacy wrapper that re-runs the
          # global `compile` target before invoking `:sandbox`, so it
          # double-compiles for no benefit on CI — drop it.
          SPEC=".verify-recipes/pr-${PR_NUMBER}.spec.ts"
          TARGET="internal-ui"
          TEMPLATE=""
          if [ -f "$SPEC" ]; then
            HEADER=$(grep -E '^// @verify-target:' "$SPEC" | head -1 || true)
            CANDIDATE=$(echo "$HEADER" | sed -E 's|.*@verify-target:[[:space:]]*||;s|[[:space:]]+$||')
            case "$CANDIDATE" in
              sandbox:*)
                TEMPLATE="${CANDIDATE#sandbox:}"
                case "$TEMPLATE" in
                  react-vite/default-ts|react-webpack/default-ts|vue3-vite/default-ts|svelte-vite/default-ts|angular-cli/default-ts|nextjs/default-ts|nextjs-vite/default-ts)
                    TARGET="sandbox"
                    ;;
                  *)
                    echo "[verify] sandbox template '$TEMPLATE' is not allowlisted; falling back to internal-ui prep (verify-pr will still emit a clear error)."
                    TEMPLATE=""
                    ;;
                esac
                ;;
            esac
          fi

          # srt-wrapped compile. Each invocation runs through env -i so
          # ACTIONS_* tokens stay out of sub-build scripts (postinstall hooks,
          # NX plugin loaders) regardless of `unset` earlier in the step.
          # UX1: $GITHUB_ENV / $GITHUB_PATH / $GITHUB_OUTPUT redirect to
          # throwaway sinks so an untrusted compile step can't write into
          # the runner's real action files.
          srt_compile() {
            env -i \
              HOME="$HOME" \
              PATH="$PATH" \
              RUNNER_TEMP="$RUNNER_TEMP" \
              NX_NO_CLOUD=true \
              PR_HEAD_DIR="$PR_HEAD_DIR" \
              GITHUB_ENV="$SINK_GITHUB_ENV" \
              GITHUB_PATH="$SINK_GITHUB_PATH" \
              GITHUB_OUTPUT="$SINK_GITHUB_OUTPUT" \
              srt --settings "$SRT_SETTINGS" \
              "$@"
          }
          if [ "$TARGET" = "sandbox" ]; then
            echo "[verify] spec targets sandbox '$TEMPLATE' — running 'nx run $TEMPLATE:sandbox'"
            # see RUNBOOK.md §sandbox-target-compile-rationale
            if ! srt_compile yarn nx run "$TEMPLATE:sandbox" 2>&1 | tee "$COMPILE_LOG"; then
              write_compile_failure_stub "$COMPILE_LOG"
              exit 0
            fi
          else
            # see RUNBOOK.md §internal-ui-compile-order
            if ! srt_compile yarn nx compile core 2>&1 | tee "$COMPILE_LOG"; then
              write_compile_failure_stub "$COMPILE_LOG"
              exit 0
            fi
            if ! srt_compile yarn nx run-many -t compile 2>&1 | tee "$COMPILE_LOG"; then
              write_compile_failure_stub "$COMPILE_LOG"
              exit 0
            fi
          fi

          # verify-pr (scripts/verify/core.ts + scripts/verify-pr.ts) reads
          # $VERIFY_RESULT_PATH (exported above) and writes verify-result.json
          # there directly. Downstream steps consume the same path via
          # ${{ steps.verify.outputs.result-path }}.
          # see RUNBOOK.md §verify-pr-exit-swallowing
          srt --settings "$SRT_SETTINGS" \
            env VERIFY_RESULT_PATH="$VERIFY_RESULT_PATH" \
            yarn verify-pr --recipe-spec ".verify-recipes/pr-${PR_NUMBER}.spec.ts" || \
            echo "verify-pr exited non-zero — verdict captured in verify-result.json"

      - name: Evidence check (vision)
        # Runs only when the initial verdict was 'verified'. ANTHROPIC_API_KEY
        # is mounted scoped to THIS step only. The script does not execute
        # LLM-generated code; it submits the diff + authored spec + screenshot
        # images to claude-haiku-4-5 and rewrites verify-result.json with
        # {evidenceVerdict, evidenceReasoning, evidenceModel}. If evidence is
        # 'missing' or 'undetermined', final verdict is rewritten to
        # 'evidence-missing'; the Retry step below picks it up. Regression
        # verdicts skip evidence-check and go straight to Retry with
        # error-context.md as feedback.
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT: ${{ steps.verify.outputs.result-path }}
        run: |
          set -euo pipefail
          if [ ! -f "$RESULT" ]; then
            echo "no verify-result.json at $RESULT — skipping evidence check"
            exit 0
          fi
          VERDICT=$(jq -r '.verdict' "$RESULT")
          if [ "$VERDICT" != "verified" ]; then
            echo "verdict is '$VERDICT' — skipping evidence check (retry will use Playwright error context)"
            exit 0
          fi
          RECIPE="$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts"
          yarn verify-evidence-check \
            --result "$RESULT" \
            --diff "$RUNNER_TEMP/pr.diff" \
            --recipe "$RECIPE"

      - name: Retry on regression or evidence missing/undetermined
        # Single retry when prior attempt's verdict was 'regression' OR
        # evidence verdict was 'missing'/'undetermined'. Feedback fed back
        # via --retry-context:
        #   - regression: error-context.md (page snapshot) + Playwright error
        #     text from playwright-report.json. Gives the author ground-truth
        #     DOM names / route paths so it can self-correct selectors.
        #   - evidence missing/undetermined: vision reasoning from
        #     evidence-check.
        # The author re-dispatches under a scoped API key. The retried
        # recipe is materialised at the same PR-head path (overwriting the
        # prior attempt). verify-pr re-runs (no recompile — runner already
        # has the compiled monorepo). Evidence-check re-runs on the new
        # result if it produced a 'verified' verdict.
        #
        # Max 1 retry. Author/evidence failures during retry are tolerated
        # so the original attempt's verdict still surfaces in the PR comment.
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NX_NO_CLOUD: 'true'
          NX_CLOUD_ACCESS_TOKEN: ''
          RESULT: ${{ steps.verify.outputs.result-path }}
        run: |
          set -euo pipefail
          if [ ! -f "$RESULT" ]; then
            echo "no verify-result.json at $RESULT — skipping retry"
            exit 0
          fi
          VERDICT=$(jq -r '.verdict' "$RESULT")
          EVIDENCE=$(jq -r '.evidenceVerdict // "n/a"' "$RESULT")
          RUN_DIR=$(dirname "$RESULT")

          REASON=""
          case "$VERDICT" in
            regression)
              # Collect page snapshots + Playwright error text from each
              # failed test directory. The page snapshot is ground truth for
              # selectors / route discovery; clip at 8 KB per file to keep
              # the retry prompt bounded.
              ERROR_CTX=""
              for f in "$RUN_DIR"/*/error-context.md; do
                [ -f "$f" ] || continue
                SLUG=$(basename "$(dirname "$f")")
                ERROR_CTX+=$'\n\n--- page snapshot at failure ('"$SLUG"$') ---\n'
                ERROR_CTX+=$(head -c 8000 "$f")
                # Pair the manager page snapshot with the preview iframe a11y
                # snapshot (when the failure-capture fixture wrote one). The
                # iframe snapshot is the only DOM the agent's preview locators
                # actually inspect; without it the agent can't tell why the
                # locator timed out.
                IF="$(dirname "$f")/iframe-snapshot.md"
                if [ -f "$IF" ]; then
                  ERROR_CTX+=$'\n\n--- preview iframe snapshot at failure ('"$SLUG"$') ---\n'
                  ERROR_CTX+=$(head -c 8000 "$IF")
                fi
              done
              # Pull the test's error message + stack from playwright-report.json
              # if available. Use --raw-output and tolerate absence.
              REPORT="$RUN_DIR/playwright-report.json"
              ERROR_MSG=""
              if [ -f "$REPORT" ]; then
                ERROR_MSG=$(jq -r '
                  [.. | objects | select(has("errors")) | .errors[]? | (.message // .stack // tostring)] | .[0] // ""
                ' "$REPORT" 2>/dev/null || true)
              fi
              REASON="Playwright assertions failed. The recipe ran but the test did not pass. Use the page snapshot below as ground truth for selectors / route paths / aria roles — if you navigated to a route that does not exist, the snapshot will say so; if a locator timed out, the actual DOM is in the snapshot. Adjust selectors / navigation accordingly. Do NOT repeat the previous attempt's selectors or routes verbatim."
              if [ -n "$ERROR_MSG" ]; then
                REASON+=$'\n\nFirst Playwright error:\n'"$ERROR_MSG"
              fi
              REASON+="$ERROR_CTX"
              echo "regression — retrying with error context (length=${#REASON})"
              ;;
            *)
              if [ "$EVIDENCE" != "missing" ] && [ "$EVIDENCE" != "undetermined" ]; then
                echo "verdict=$VERDICT evidence=$EVIDENCE — no retry needed"
                exit 0
              fi
              REASON=$(jq -r '.evidenceReasoning // ""' "$RESULT")
              echo "evidence $EVIDENCE — retrying with vision reasoning"
              ;;
          esac

          # shellcheck disable=SC2012
          PRIOR_RUN_DIR=$(ls -dt "$PR_HEAD_DIR"/.verify-output/*/ 2>/dev/null | head -1 || true)
          if ! yarn verify-pr-generate \
              --pr "$PR_NUMBER" \
              --force \
              --base-sha "$BASE_SHA" \
              --head-sha "$PR_HEAD_SHA" \
              --prior-run-dir "${PRIOR_RUN_DIR%/}" \
              --output "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts" \
              --retry-context "$REASON"; then
            echo "retry verify-pr-generate failed — keeping original verdict"
            exit 0
          fi

          # shellcheck disable=SC2012
          BUNDLE=$(ls -t .verify-output/*/prompt-bundle.json | head -1)
          if ! yarn verify-pr-author --bundle "$BUNDLE"; then
            echo "retry verify-pr-author failed — keeping original verdict"
            exit 0
          fi

          # Capture mtime of the trusted result so we can detect whether the
          # retry actually produced a new write. The retry overwrites
          # $RESULT in place (verify-pr respects VERIFY_RESULT_PATH).
          PREV_MTIME=$(stat -c '%Y' "$RESULT" 2>/dev/null || stat -f '%m' "$RESULT" 2>/dev/null || echo 0)

          # Sub-shell so set -e here doesn't kill the outer step on regression.
          # C8: env -i (allowlist) instead of env -u (denylist) so the
          # agent-emitted spec only sees the variables we explicitly thread
          # in. Mirrors the first-run Verify PR step's path so a leak there
          # can't reappear on retry.
          (
            cd "$PR_HEAD_DIR"
            env -i \
              HOME="$HOME" \
              PATH="$PATH" \
              RUNNER_TEMP="$RUNNER_TEMP" \
              NX_NO_CLOUD=true \
              PR_HEAD_DIR="$PR_HEAD_DIR" \
              VERIFY_RESULT_PATH="$RESULT" \
              srt --settings "$SRT_SETTINGS" \
              yarn verify-pr --recipe-spec ".verify-recipes/pr-${PR_NUMBER}.spec.ts"
          ) || \
            echo "retry verify-pr exited non-zero — evidence-check will still run if verdict==verified"

          NEW_MTIME=$(stat -c '%Y' "$RESULT" 2>/dev/null || stat -f '%m' "$RESULT" 2>/dev/null || echo 0)
          if [ "$NEW_MTIME" = "$PREV_MTIME" ]; then
            echo "retry produced no new verify-result.json — keeping original verdict"
            exit 0
          fi
          # Annotate the (overwritten) trusted result so downstream observers
          # know this came from the retry loop.
          jq '. + {evidenceRetry: true}' "$RESULT" > "$RESULT.tmp" && mv "$RESULT.tmp" "$RESULT"

          # Evidence-check only meaningful on a verified verdict; on
          # regression the screenshots typically don't capture the change.
          NEW_VERDICT=$(jq -r '.verdict' "$RESULT")
          if [ "$NEW_VERDICT" = "verified" ]; then
            yarn verify-evidence-check \
              --result "$RESULT" \
              --diff "$RUNNER_TEMP/pr.diff" \
              --recipe "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts" || true
          fi

          FINAL_EVIDENCE=$(jq -r '.evidenceVerdict // "n/a"' "$RESULT")
          echo "retry complete — final verdict=$NEW_VERDICT evidence=$FINAL_EVIDENCE"

      - name: Run PR-added unit tests
        # Complementary verification signal: when the PR ships its own
        # *.test.{ts,tsx,…} alongside the diff (e.g. PR #16 added
        # HighlightStyles.test.tsx), run them via vitest. Result is folded
        # into verify-result.json under `unitTests` — Playwright + unit
        # tests together give reviewers AND/OR confidence the diff works.
        # This step does NOT change the existing verdict; the comment
        # renders unit-test status alongside the Playwright verdict so
        # they're visible together. A regression in unit tests but a
        # verified Playwright recipe (or vice versa) is informative on
        # its own.
        if: always()
        working-directory: ${{ runner.temp }}/pr-head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NX_NO_CLOUD: 'true'
          NX_CLOUD_ACCESS_TOKEN: ''
          RESULT: ${{ steps.verify.outputs.result-path }}
        run: |
          set -euo pipefail
          # Layer-1 security: PR-added test files are agent / contributor
          # content, untrusted under pull_request_target. Strip secrets so
          # a malicious test file can't read GITHUB_TOKEN /
          # ANTHROPIC_API_KEY from env. This step doesn't need either.
          # C3: extended unset to cover every actions / telemetry token
          # shape; the actual vitest run is also wrapped in env -i below
          # so this is belt-and-suspenders.
          unset GITHUB_TOKEN GH_TOKEN ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN \
                ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN \
                ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RESULTS_URL ACTIONS_CACHE_URL \
                TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_URL \
                TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_TOKEN
          if [ ! -f "$RESULT" ]; then
            echo "no verify-result.json at $RESULT — skipping unit-test step"
            exit 0
          fi

          # Extract added/modified test files from the captured PR diff.
          # Pattern matches `*.test.*` and `*.spec.*` under code/ — wide
          # enough to catch component / utility tests; the workflow has
          # already declined to run if the PR comment label gate was off.
          # M1: pull from $RUNNER_TEMP/pr.diff (not /tmp, which is in srt
          # allowWrite and reachable from untrusted recipes).
          TEST_FILES=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            TEST_FILES+=("$f")
          done < <(
            grep -E '^\+\+\+ b/code/.+\.(test|spec)\.(ts|tsx|js|jsx)$' "$RUNNER_TEMP/pr.diff" 2>/dev/null \
              | sed 's|^+++ b/||' \
              | sort -u
          )

          if [ ${#TEST_FILES[@]} -eq 0 ]; then
            echo "no PR-added unit tests detected — recording n/a"
            jq '. + {unitTests: {ran: false, files: [], passed: null, summary: "no PR-added test files in diff"}}' \
              "$RESULT" > "$RESULT.tmp" && mv "$RESULT.tmp" "$RESULT"
            exit 0
          fi

          echo "running ${#TEST_FILES[@]} unit test file(s): ${TEST_FILES[*]}"
          REPORT="$RUNNER_TEMP/unit-tests-report.json"
          VITEST_LOG="$RUNNER_TEMP/vitest.log"

          # C3: vitest runs the PR-added test files (untrusted code under
          # pull_request_target). Wrap in srt + env -i so a malicious test
          # cannot read ACTIONS_* / token envs and cannot reach the network
          # outside the allowedDomains list. `--` separates vitest flags
          # from positional test paths; without it a test file named
          # `--cleanup` would be parsed as an option.
          # `set -e` is off for this block so vitest exit codes don't kill
          # the step; we surface the verdict via JSON inspection.
          set +e
          env -i \
            HOME="$HOME" \
            PATH="$PATH" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            NX_NO_CLOUD=true \
            PR_HEAD_DIR="$PR_HEAD_DIR" \
            srt --settings "$SRT_SETTINGS" \
            yarn vitest run --reporter=json --outputFile "$REPORT" -- "${TEST_FILES[@]}" > "$VITEST_LOG" 2>&1
          VITEST_EXIT=$?
          set -e

          if [ -f "$REPORT" ]; then
            PASSED=$(jq '.numFailedTests == 0 and .numFailedTestSuites == 0' "$REPORT")
            SUMMARY=$(jq -r '"\(.numPassedTests) passed, \(.numFailedTests) failed across \(.numTotalTestSuites) suite(s)"' "$REPORT")
          else
            PASSED=false
            SUMMARY="vitest exited $VITEST_EXIT without writing a JSON report (likely setup error); see Action log"
          fi
          # UC4: strip all C0/C1 control chars + ANSI CSI/OSC/DCS escapes
          # via perl so the captured details render cleanly in the PR
          # comment regardless of terminal-control noise vitest emits.
          DETAILS=$(tail -c 4000 "$VITEST_LOG" \
            | perl -pe 's/\x1B[@-Z\\-_]|\x1B\[[0-?]*[ -\/]*[@-~]|\x1B\][^\x07\x1B]*(?:\x07|\x1B\\)|\x1BP[^\x1B]*\x1B\\|[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]//g' \
            | jq -Rs .)

          jq \
            --argjson passed "$PASSED" \
            --arg summary "$SUMMARY" \
            --argjson files "$(printf '%s\n' "${TEST_FILES[@]}" | jq -R . | jq -s .)" \
            --argjson details "$DETAILS" \
            '. + {unitTests: {ran: true, files: $files, passed: $passed, summary: $summary, details: $details}}' \
            "$RESULT" > "$RESULT.tmp" && mv "$RESULT.tmp" "$RESULT"
          echo "unit-tests verdict: $SUMMARY (passed=$PASSED, exit=$VITEST_EXIT)"

      - name: Read verdict
        id: verdict
        if: always()
        env:
          RESULT: ${{ steps.verify.outputs.result-path }}
        run: |
          set -euo pipefail
          # C13: derive-verdict.ts reads $RESULT, derives regressionReason from
          # playwright-report.json when absent, downgrades verified→regression
          # if PR-added unit tests failed, and emits `verdict=<value>` to
          # $GITHUB_OUTPUT. ANSI / control-char stripping lives in the helper.
          if [ ! -f "$RESULT" ]; then
            echo "verdict=missing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REPORT="$(dirname "$RESULT")/playwright-report.json"
          node "$GITHUB_WORKSPACE/scripts/verify/ci/derive-verdict.ts" \
            --result "$RESULT" \
            --report "$REPORT" \
            >> "$GITHUB_OUTPUT"

      - name: Apply verified-by-harness label
        if: steps.verdict.outputs.verdict == 'verified'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # Ensure the label exists on the repo (idempotent — `gh label create`
          # exits non-zero if the label already exists, which we swallow).
          gh label create verified-by-harness \
            --repo "$REPO" \
            --description "Verified by PR Verify Harness" \
            --color 0E8A16 \
            2>/dev/null || true
          gh pr edit "$PR_NUMBER" \
            --repo "$REPO" \
            --add-label verified-by-harness

      - name: Push screenshots to side branch
        id: screenshots
        if: always() && steps.verdict.outputs.verdict != '' && steps.verdict.outputs.verdict != 'missing'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        # C14: push-screenshots.ts encapsulates side-branch clone/orphan
        # init, PNG mime validation, per-file 5 MB cap, 50 MB bundle cap,
        # commit + push, and `urls<<EOF` heredoc emit. The helper owns git
        # user config + the x-access-token auth URL.
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/verify/ci/push-screenshots.ts" \
            --source "$PR_HEAD_DIR/.verify-output" \
            --pr "$PR_NUMBER" \
            --run-id "$RUN_ID" \
            --repo "$REPO" \
            --assets-dir "$RUNNER_TEMP/verify-assets" \
            --output "$GITHUB_OUTPUT"

      - name: Append telemetry
        # POST one row per run to a Google Apps Script web app that
        # appends to a Sheet (sheet schema: run_id, pr_number, verdict,
        # target, evidence_verdict, evidence_retry, unit_tests_ran,
        # unit_tests_passed, duration_ms, timestamp). After 10–20 PRs we
        # can answer: verified-first-try % vs after-retry vs regression,
        # vision false-negative rate, sandbox-path vs internal-ui
        # breakdown, duration distribution. Drives v8 prioritisation.
        #
        # No-ops when the webhook secrets aren't configured so forks
        # without telemetry sinks don't fail this step.
        if: always() && steps.verdict.outputs.verdict != '' && steps.verdict.outputs.verdict != 'missing'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_URL: ${{ secrets.TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_URL }}
          TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_TOKEN: ${{ secrets.TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_TOKEN }}
          RESULT: ${{ steps.verify.outputs.result-path }}
        run: |
          set -euo pipefail
          # POST one row per run to a Google Apps Script web app that
          # appends to a Sheet (run_id, pr_number, verdict, target,
          # evidence_verdict, evidence_retry, unit_tests_ran,
          # unit_tests_passed, duration_ms, token counts, model, timestamp).
          # Implementation lives in scripts/verify/ci/append-telemetry.ts —
          # emits raw token counts only; Sheets/Apps Script downstream
          # computes USD from token counts + model id so no pricing
          # table lives in CI.
          #
          # No-ops when the webhook secrets aren't configured so forks
          # without telemetry sinks don't fail this step.
          node "$GITHUB_WORKSPACE/scripts/verify/ci/append-telemetry.ts" \
            --result "$RESULT" \
            --pr "$PR_NUMBER" \
            --run-id "$RUN_ID" \
            --dispatch-dir "$PR_HEAD_DIR/.verify-output" \
            --dispatch-dir "$GITHUB_WORKSPACE/.verify-output" \
            --curl-cfg "$RUNNER_TEMP/.curl-cfg"

      - name: Stage artifacts (rename dotdirs)
        # actions/upload-artifact v7 ships dotfiles into the zip, but
        # tools like macOS Finder + most unzippers hide them by default,
        # which makes the artifact look empty even though it is ~MBs.
        # Stage the contents under non-dot names so reviewers can browse
        # the zip without toggling hidden-file display.
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/verify-artifacts"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/runner-pr-head" "$STAGE/base"
          if [ -d "$PR_HEAD_DIR/.verify-output" ]; then
            cp -a "$PR_HEAD_DIR/.verify-output/." "$STAGE/runner-pr-head/verify-output/"
          fi
          if [ -d "$PR_HEAD_DIR/.verify-recipes" ]; then
            mkdir -p "$STAGE/runner-pr-head/verify-recipes"
            # Only include the materialised PR spec (trusted helpers
            # _util.ts + example-smoke.spec.ts live in the base copy).
            if [ -f "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts" ]; then
              cp "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts" \
                "$STAGE/runner-pr-head/verify-recipes/pr-${PR_NUMBER}.spec.ts"
            fi
          fi
          if [ -d "$GITHUB_WORKSPACE/.verify-output" ]; then
            cp -a "$GITHUB_WORKSPACE/.verify-output/." "$STAGE/base/verify-output/"
          fi
          echo "VERIFY_ARTIFACTS_DIR=$STAGE" >> "$GITHUB_ENV"
          # shellcheck disable=SC2012
          ls -la "$STAGE" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-output-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ env.VERIFY_ARTIFACTS_DIR }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Post PR comment
        if: always()
        env:
          SCREENSHOT_URLS: ${{ steps.screenshots.outputs.urls }}
          RESULT: ${{ steps.verify.outputs.result-path }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // UC4: sanitize untrusted text (compile output, vitest stdout)
            // before rendering in the PR comment. The pattern catches
            // token-shaped substrings ("Bearer abcd1234…"), prefixed API
            // keys (Anthropic / OpenAI / GitHub PAT / AWS access key)
            // anywhere they may leak — postinstall errors, Authorization
            // header echoes, etc.
            const SECRET_RE = /(token|key|password|secret|bearer)[a-zA-Z0-9_-]+|sk-(ant|live|test)[a-zA-Z0-9_-]{20,}|gh[pousr]_[a-zA-Z0-9]{36,}|AKIA[A-Z0-9]{16}/gi;
            function redact(text) {
              if (text == null) return text;
              return String(text).replace(SECRET_RE, '[REDACTED]');
            }

            function renderScreenshots() {
              let raw = process.env.SCREENSHOT_URLS;
              if (!raw || raw.trim() === '' || raw.trim() === '[]') return '';
              let items;
              try {
                items = JSON.parse(raw);
              } catch {
                return '';
              }
              if (!Array.isArray(items) || items.length === 0) return '';
              const blocks = items.map(
                (it) => `### \`${it.rel}\`\n\n![${it.rel}](${it.url})\n`,
              );
              return `\n\n## Screenshots\n\n${blocks.join('\n')}`;
            }

            let body;
            try {
              // C5: read the trusted result path threaded via $GITHUB_OUTPUT
              // by the Verify PR step. Globbing the PR-writable
              // .verify-output tree would let a malicious recipe forge a
              // verify-result.json with verdict=verified.
              const resultPath = process.env.RESULT;
              if (!resultPath || !fs.existsSync(resultPath)) {
                body = `## Verify Harness\n\nNo verdict produced — the workflow failed before the harness ran (likely recipe-author dispatch, deny-regex, or lint). See [run log](${url}) for details.`;
              } else {
                const verdict = JSON.parse(fs.readFileSync(resultPath, 'utf-8'));
                const retrySuffix = verdict.evidenceRetry ? ' (after 1 retry)' : '';
                const evidenceLine = verdict.evidenceVerdict
                  ? `\n\nEvidence${retrySuffix} (vision-check, \`${verdict.evidenceModel ?? 'claude-haiku-4-5'}\`): \`${verdict.evidenceVerdict}\`${
                      verdict.evidenceReasoning
                        ? `\n\n<details><summary>Vision reasoning</summary>\n\n${verdict.evidenceReasoning}\n\n</details>`
                        : ''
                    }`
                  : '';
                const detailsBlock = verdict.regressionDetails
                  ? `\n\n<details><summary>Compile output (last 4KB)</summary>\n\n\`\`\`\n${redact(String(verdict.regressionDetails)).slice(0, 4000)}\n\`\`\`\n\n</details>`
                  : '';
                let unitTestsLine = '';
                if (verdict.unitTests && verdict.unitTests.ran) {
                  const status = verdict.unitTests.passed ? '✅ passed' : '❌ failed';
                  const filesList = (verdict.unitTests.files ?? [])
                    .map((f) => `\`${f}\``)
                    .join(', ');
                  unitTestsLine = `\n\nPR-added unit tests: ${status} — ${verdict.unitTests.summary || ''}${filesList ? `\n\nFiles: ${filesList}` : ''}`;
                  if (!verdict.unitTests.passed && verdict.unitTests.details) {
                    unitTestsLine += `\n\n<details><summary>vitest output (last 4KB)</summary>\n\n\`\`\`\n${redact(String(verdict.unitTests.details)).slice(0, 4000)}\n\`\`\`\n\n</details>`;
                  }
                }
                body = `## Verify Harness\n\nVerdict: \`${verdict.verdict}\` (target \`${verdict.template}\`)${verdict.regressionReason ? `\n\nReason: \`${redact(verdict.regressionReason)}\`` : ''}${detailsBlock}${evidenceLine}${unitTestsLine}\n\nReplay: \`npx playwright show-trace\` on the trace.zip listed under "Artifacts" on the [run summary page](${url}).${renderScreenshots()}`;
              }
            } catch (err) {
              body = `## Verify Harness\n\nError reading verdict: \`${err.message}\`. See [run log](${url}).`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if final verdict is not verified
        # Preserve red-CI signal. Earlier Verify-PR step swallows non-zero
        # exit so retry can run; this terminal gate restores the fail
        # signal for ANY non-'verified' outcome (regression, evidence-missing,
        # missing, etc.) so silent failure modes can't slip through green.
        if: always() && steps.verdict.outputs.verdict != 'verified'
        env:
          VERDICT: ${{ steps.verdict.outputs.verdict }}
        run: |
          echo "Final verdict: ${VERDICT:-<empty>} — failing job."
          exit 1
