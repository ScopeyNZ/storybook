name: PR Verification Harness
on:
  pull_request_target:
    types: [labeled, synchronize]
    paths-ignore: ['docs/**', '**/*.md', '.github/**']

# v6 single-round model: recipe is authored AND executed in the same workflow
# run. The authored spec is materialised straight into the untrusted PR-head
# workspace ($RUNNER_TEMP/pr-head/.verify-recipes/pr-<#>.spec.ts) — never
# committed. See scripts/verify/SECURITY.md for the load-bearing controls.

jobs:
  verify:
    if: github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:verify')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    concurrency:
      group: verify-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      issues: write
      statuses: write
      contents: write   # needed to push screenshots to the _verify-screenshots side branch
    steps:
      - name: Check actor permission
        uses: prince-chrismc/check-actor-permissions-action@d504e74ba31658f4cdf4fcfeb509d4c09736d88e # v3.0.2
        with:
          permission: write
      - name: Checkout base
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # `pull_request.base.sha` is captured at PR creation / sync and lags
          # behind the actual base-branch tip when the base advances independently
          # of the PR head. The harness depends on always-latest trusted scripts
          # (verify-pr-generate flags, deny-regex, lint config) so we pin to the
          # branch ref instead — pull_request_target keeps execution on trusted
          # workflow + script content either way.
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Setup Node.js and Install Dependencies
        uses: ./.github/actions/setup-node-and-install
        with:
          install-code-deps: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Compute paths
        # Export PR_HEAD_DIR via $GITHUB_ENV so every subsequent step can
        # reference $PR_HEAD_DIR (shell) or ${{ env.PR_HEAD_DIR }} (YAML).
        # ${{ runner.temp }} is only valid in step contexts, not at job-env
        # level — this is the canonical workaround.
        run: echo "PR_HEAD_DIR=${{ runner.temp }}/pr-head" >> "$GITHUB_ENV"

      - name: Checkout PR head (untrusted execution context)
        # Manual git clone instead of actions/checkout because the repo carries
        # gitlinks (.external/addon-svelte-csf etc.) without a .gitmodules file,
        # which breaks actions/checkout's submodule-foreach cleanup pass under
        # persist-credentials: false. The manual clone never writes auth into
        # pr-head/.git, preserving the same security posture as
        # persist-credentials: false.
        #
        # Cloning into $RUNNER_TEMP (outside the base checkout tree) so that
        # nx / yarn / jiti module resolution inside pr-head never walks up
        # into the base checkout's node_modules — that escape was the round-3
        # / round-4 failure mode (eslint-plugin prebuild resolved
        # `storybook/csf` to the base copy, which has no `dist/csf` yet).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git -c protocol.version=2 clone \
            --no-tags --no-checkout --filter=blob:none \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" \
            "$PR_HEAD_DIR"
          cd "$PR_HEAD_DIR"
          git -c protocol.version=2 fetch --no-tags --depth=1 origin "$PR_HEAD_SHA"
          git checkout --force "$PR_HEAD_SHA"
          git remote set-url origin "https://github.com/${REPO}.git"
          git config --local --unset-all credential.helper 2>/dev/null || true

      - name: Fetch PR diff
        run: gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr.diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate bundle
        # Trusted scripts (base checkout) read trusted authoring-guide +
        # canonical smoke + triage rules from the base. The bundle's
        # outputSpecPath is set to the ephemeral PR-head path so the Author
        # step writes the recipe straight into the untrusted workspace.
        run: |
          yarn verify-pr-generate \
            --pr ${{ github.event.pull_request.number }} \
            --force \
            --output "$PR_HEAD_DIR/.verify-recipes/pr-${{ github.event.pull_request.number }}.spec.ts"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Author recipe
        # ANTHROPIC_API_KEY is scoped to THIS step only. The Verify step that
        # executes the authored spec has no API key. Static deny-regex +
        # scoped lint inside recipe-author-core gate what lands on disk.
        run: |
          # shellcheck disable=SC2012
          BUNDLE=$(ls -t .verify-output/*/prompt-bundle.json | head -1)
          yarn verify-pr-author --bundle "$BUNDLE"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Sync trusted .verify-recipes helpers into PR head
        # The authored spec imports `./_util.ts` (which re-exports `expect`
        # + a `test` extended with the auto-failure-capture fixture). The
        # PR-head checkout has a copy of `_util.ts` at the SHA the PR
        # branched from, which lags behind the base branch's harness
        # iteration. Always overwrite with the base-branch version so the
        # spec runs against the current util contract. example-smoke.spec.ts
        # is copied alongside so reference recipes stay aligned.
        run: |
          set -euo pipefail
          mkdir -p "$PR_HEAD_DIR/.verify-recipes"
          cp .verify-recipes/_util.ts "$PR_HEAD_DIR/.verify-recipes/_util.ts"
          cp .verify-recipes/example-smoke.spec.ts "$PR_HEAD_DIR/.verify-recipes/example-smoke.spec.ts"

      - name: Install sandbox-runtime (Layer-2)
        # Layer-2 defense-in-depth: wrap `yarn verify-pr` (the only step that
        # executes the agent-emitted Playwright spec from untrusted PR-head
        # code) in @anthropic-ai/sandbox-runtime. bubblewrap-backed FS +
        # network jail so a compromised recipe can't reach ~/.ssh, ~/.aws,
        # ~/.npmrc, or the public internet. Layer-1 already strips creds
        # from env; Layer-2 catches anything that survives env-stripping
        # plus tightens the FS attack surface.
        #
        # ubuntu-22.04 has unprivileged user namespaces enabled by default,
        # which bubblewrap requires. ubuntu-24.04+ would need
        # `sysctl kernel.apparmor_restrict_unprivileged_userns=0`.
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat ripgrep
          sudo npm install -g @anthropic-ai/sandbox-runtime
          srt --version

      - name: Build sandbox settings
        # Linux srt requires literal paths (no glob, no env var expansion).
        # Compose the settings file at runtime so $RUNNER_TEMP / $HOME
        # resolve to the runner's actual paths. denyRead the high-value
        # credential targets even though default reads are allow (extra
        # belt-and-suspenders alongside Layer-1's env stripping). allowWrite
        # covers RUNNER_TEMP (contains PR_HEAD_DIR + .verify-output),
        # $SANDBOX_TMPDIR (TMPDIR override, see below), and HOME/.cache
        # (playwright binary cache writes during browser launch).
        #
        # CLAUDE_CODE_TMPDIR: srt sets TMPDIR=/tmp/claude inside the
        # sandbox by default (see anthropic-experimental/sandbox-runtime
        # src/sandbox/sandbox-utils.ts L320-325). It then `--bind`s host
        # paths into the sandbox at the same paths — but bwrap doesn't
        # auto-create them, so if /tmp/claude doesn't exist on the host,
        # yarn's mktempPromise crashes with ENOENT. Override with a path
        # under RUNNER_TEMP we pre-create and that's already in allowWrite.
        run: |
          set -euo pipefail
          SANDBOX_TMPDIR="$RUNNER_TEMP/sandbox-tmp"
          mkdir -p "$SANDBOX_TMPDIR"
          # bwrap --bind requires the host source to exist. Pre-create
          # $HOME/.storybook so Storybook's global settings writes
          # (~/.storybook/settings.json) don't EROFS inside the sandbox.
          # Note this is the GLOBAL user-prefs file; workspace .storybook
          # at $PR_HEAD_DIR/code/.storybook is already covered by the
          # $RUNNER_TEMP allowWrite entry.
          mkdir -p "$HOME/.storybook"
          cat > "$RUNNER_TEMP/srt-settings.json" <<JSON
          {
            "network": {
              "allowLocalBinding": true,
              "allowedDomains": [],
              "deniedDomains": []
            },
            "filesystem": {
              "allowRead": [],
              "allowWrite": [
                "$RUNNER_TEMP",
                "/tmp",
                "$HOME/.cache",
                "$HOME/.local/share",
                "$HOME/.storybook"
              ],
              "denyRead": [
                "$HOME/.ssh",
                "$HOME/.aws",
                "$HOME/.docker",
                "$HOME/.npmrc",
                "$HOME/.gitconfig",
                "$HOME/.config/gh"
              ],
              "denyWrite": []
            }
          }
          JSON
          echo "SRT_SETTINGS=$RUNNER_TEMP/srt-settings.json" >> "$GITHUB_ENV"
          echo "CLAUDE_CODE_TMPDIR=$SANDBOX_TMPDIR" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/srt-settings.json"

      - name: Verify PR
        working-directory: ${{ runner.temp }}/pr-head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Force Nx to run locally — the fork harness firetest runs without
          # Nx Cloud org auth, and the Verify step does not need distributed
          # cache. Upstream CI behaviour is unaffected (other steps that
          # already use Nx Cloud auth continue to do so).
          NX_NO_CLOUD: 'true'
          NX_CLOUD_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          # Layer-1 security: drop secrets from the env before invoking any
          # PR-head script. `pull_request_target` runs build / sandbox /
          # recipe code from the untrusted PR head as the same runner user
          # that holds GITHUB_TOKEN (contents:write, pull-requests:write,
          # screenshots-branch push) and the (already step-scoped)
          # ANTHROPIC_API_KEY. A compromised build script or agent-emitted
          # recipe could otherwise exfil them. This step doesn't need any
          # of these secrets — compile + verify-pr only touch localhost +
          # the PR-head workspace.
          unset GITHUB_TOKEN GH_TOKEN ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          yarn install --immutable
          # Install the Playwright chromium browser binary on the runner
          # (the GitHub-hosted ubuntu-22.04 image does not pre-bundle
          # @playwright/test browsers).
          yarn playwright install --with-deps chromium

          # Stub a regression verdict if compile fails. Without this, the
          # workflow short-circuits before verify-result.json is written and
          # the PR comment shows "No verdict produced" — confusing for cases
          # like PR #15 where the upstream PR genuinely doesn't compile.
          # The stub captures the tail of the compile output as
          # regressionReason so reviewers see WHY the verdict is regression.
          write_compile_failure_stub() {
            local log="$1"
            local run_id
            run_id="$(date -u +%Y-%m-%dT%H-%M-%S.000Z)"
            local out_dir=".verify-output/${run_id}"
            mkdir -p "$out_dir"
            local reason
            # Strip ANSI escape sequences (CSI / SGR) so the PR comment shows
            # readable text rather than `^[[31m`-style noise.
            reason="$(tail -c 4000 "$log" | tr -d '\000' | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | jq -Rs .)"
            jq -n \
              --arg runId "$run_id" \
              --arg template "internal-ui" \
              --argjson reason "$reason" \
              '{
                schemaVersion: 1,
                runId: $runId,
                verdict: "regression",
                template: $template,
                regressionReason: "compile failure (see regressionDetails)",
                regressionDetails: $reason,
                storyIds: [],
                recipeSpecPath: "",
                tests: [],
                traceZipPaths: [],
                durations: {},
                createdAt: (now | todate)
              }' > "$out_dir/verify-result.json"
            echo "[verify] compile failure — wrote stub verdict to $out_dir/verify-result.json"
          }
          COMPILE_LOG="$RUNNER_TEMP/verify-compile.log"
          # Pick the prep path based on the recipe's @verify-target header.
          # internal-ui: needs `nx compile core` (so `code/core/dist/bin/
          # dispatcher.js` exists for bootInternalUi) plus the rest of the
          # workspace compiled so the dev server can resolve every addon /
          # framework `code/.storybook/main.ts` imports.
          # sandbox:<tpl>: `nx run <tpl>:sandbox` handles all compile deps
          # via the project's implicitDependencies + emits the sandbox dir
          # at `code/sandbox/<key>` (verify-pr's resolveSandboxDir checks
          # this path before falling through to `../storybook-sandboxes`).
          # `yarn task sandbox` is the legacy wrapper that re-runs the
          # global `compile` target before invoking `:sandbox`, so it
          # double-compiles for no benefit on CI — drop it.
          SPEC=".verify-recipes/pr-${PR_NUMBER}.spec.ts"
          TARGET="internal-ui"
          TEMPLATE=""
          if [ -f "$SPEC" ]; then
            HEADER=$(grep -E '^// @verify-target:' "$SPEC" | head -1 || true)
            CANDIDATE=$(echo "$HEADER" | sed -E 's|.*@verify-target:[[:space:]]*||;s|[[:space:]]+$||')
            case "$CANDIDATE" in
              sandbox:*)
                TEMPLATE="${CANDIDATE#sandbox:}"
                case "$TEMPLATE" in
                  react-vite/default-ts|react-webpack/default-ts|vue3-vite/default-ts|svelte-vite/default-ts|angular-cli/default-ts|nextjs/default-ts|nextjs-vite/default-ts)
                    TARGET="sandbox"
                    ;;
                  *)
                    echo "[verify] sandbox template '$TEMPLATE' is not allowlisted; falling back to internal-ui prep (verify-pr will still emit a clear error)."
                    TEMPLATE=""
                    ;;
                esac
                ;;
            esac
          fi

          if [ "$TARGET" = "sandbox" ]; then
            echo "[verify] spec targets sandbox '$TEMPLATE' — running 'nx run $TEMPLATE:sandbox'"
            # The `:sandbox` target resolves implicitDependencies (core,
            # cli, addons, the framework package) and generates the
            # sandbox project under code/sandbox/<key>. No extra
            # `nx compile core` / `run-many` needed — nx topo-orders deps
            # itself.
            if ! yarn nx run "$TEMPLATE:sandbox" 2>&1 | tee "$COMPILE_LOG"; then
              write_compile_failure_stub "$COMPILE_LOG"
              exit 0
            fi
          else
            # internal-ui path. Compile core first (eslint-plugin's
            # prebuild script imports `storybook/csf` via jiti and needs
            # `storybook/dist/csf/index.js` to resolve; nx run-many does
            # not topo-order this unless `dependsOn: ["^compile"]` is set,
            # which the repo currently lacks for the eslint-plugin chain).
            if ! yarn nx compile core 2>&1 | tee "$COMPILE_LOG"; then
              write_compile_failure_stub "$COMPILE_LOG"
              exit 0
            fi
            # Then compile every other NX project so the internal-ui dev
            # server can resolve @storybook/react-vite + every addon
            # listed in code/.storybook/main.ts.
            if ! yarn nx run-many -t compile 2>&1 | tee "$COMPILE_LOG"; then
              write_compile_failure_stub "$COMPILE_LOG"
              exit 0
            fi
          fi

          # Swallow non-zero exit so downstream Evidence-check / Retry steps
          # always run. Final verdict gate at end of job ("Fail job if final
          # verdict is regression") preserves red-CI signal based on the
          # post-retry verdict in verify-result.json.
          # Layer-2: srt wraps just this invocation — install + compile
          # above legitimately need full FS + network for yarn registries +
          # node_modules writes, so they run outside the sandbox.
          srt --settings "$SRT_SETTINGS" \
            yarn verify-pr --recipe-spec ".verify-recipes/pr-${PR_NUMBER}.spec.ts" || \
            echo "verify-pr exited non-zero — verdict captured in verify-result.json"

      - name: Evidence check (vision)
        # Runs only when the initial verdict was 'verified'. ANTHROPIC_API_KEY
        # is mounted scoped to THIS step only. The script does not execute
        # LLM-generated code; it submits the diff + authored spec + screenshot
        # images to claude-haiku-4-5 and rewrites verify-result.json with
        # {evidenceVerdict, evidenceReasoning, evidenceModel}. If evidence is
        # 'missing' or 'undetermined', final verdict is rewritten to
        # 'evidence-missing'; the Retry step below picks it up. Regression
        # verdicts skip evidence-check and go straight to Retry with
        # error-context.md as feedback.
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! compgen -G "$PR_HEAD_DIR/.verify-output/*/verify-result.json" >/dev/null; then
            echo "no verify-result.json — skipping evidence check"
            exit 0
          fi
          # shellcheck disable=SC2012
          RESULT=$(ls -t "$PR_HEAD_DIR"/.verify-output/*/verify-result.json | head -1)
          VERDICT=$(jq -r '.verdict' "$RESULT")
          if [ "$VERDICT" != "verified" ]; then
            echo "verdict is '$VERDICT' — skipping evidence check (retry will use Playwright error context)"
            exit 0
          fi
          RECIPE="$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts"
          yarn verify-evidence-check \
            --result "$RESULT" \
            --diff /tmp/pr.diff \
            --recipe "$RECIPE"

      - name: Retry on regression or evidence missing/undetermined
        # Single retry when prior attempt's verdict was 'regression' OR
        # evidence verdict was 'missing'/'undetermined'. Feedback fed back
        # via --retry-context:
        #   - regression: error-context.md (page snapshot) + Playwright error
        #     text from playwright-report.json. Gives the author ground-truth
        #     DOM names / route paths so it can self-correct selectors.
        #   - evidence missing/undetermined: vision reasoning from
        #     evidence-check.
        # The author re-dispatches under a scoped API key. The retried
        # recipe is materialised at the same PR-head path (overwriting the
        # prior attempt). verify-pr re-runs (no recompile — runner already
        # has the compiled monorepo). Evidence-check re-runs on the new
        # result if it produced a 'verified' verdict.
        #
        # Max 1 retry. Author/evidence failures during retry are tolerated
        # so the original attempt's verdict still surfaces in the PR comment.
        if: always()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NX_NO_CLOUD: 'true'
          NX_CLOUD_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          if ! compgen -G "$PR_HEAD_DIR/.verify-output/*/verify-result.json" >/dev/null; then
            echo "no verify-result.json — skipping retry"
            exit 0
          fi
          # shellcheck disable=SC2012
          RESULT=$(ls -t "$PR_HEAD_DIR"/.verify-output/*/verify-result.json | head -1)
          VERDICT=$(jq -r '.verdict' "$RESULT")
          EVIDENCE=$(jq -r '.evidenceVerdict // "n/a"' "$RESULT")
          RUN_DIR=$(dirname "$RESULT")

          REASON=""
          case "$VERDICT" in
            regression)
              # Collect page snapshots + Playwright error text from each
              # failed test directory. The page snapshot is ground truth for
              # selectors / route discovery; clip at 8 KB per file to keep
              # the retry prompt bounded.
              ERROR_CTX=""
              for f in "$RUN_DIR"/*/error-context.md; do
                [ -f "$f" ] || continue
                SLUG=$(basename "$(dirname "$f")")
                ERROR_CTX+=$'\n\n--- page snapshot at failure ('"$SLUG"$') ---\n'
                ERROR_CTX+=$(head -c 8000 "$f")
                # Pair the manager page snapshot with the preview iframe a11y
                # snapshot (when the failure-capture fixture wrote one). The
                # iframe snapshot is the only DOM the agent's preview locators
                # actually inspect; without it the agent can't tell why the
                # locator timed out.
                IF="$(dirname "$f")/iframe-snapshot.md"
                if [ -f "$IF" ]; then
                  ERROR_CTX+=$'\n\n--- preview iframe snapshot at failure ('"$SLUG"$') ---\n'
                  ERROR_CTX+=$(head -c 8000 "$IF")
                fi
              done
              # Pull the test's error message + stack from playwright-report.json
              # if available. Use --raw-output and tolerate absence.
              REPORT="$RUN_DIR/playwright-report.json"
              ERROR_MSG=""
              if [ -f "$REPORT" ]; then
                ERROR_MSG=$(jq -r '
                  [.. | objects | select(has("errors")) | .errors[]? | (.message // .stack // tostring)] | .[0] // ""
                ' "$REPORT" 2>/dev/null || true)
              fi
              REASON="Playwright assertions failed. The recipe ran but the test did not pass. Use the page snapshot below as ground truth for selectors / route paths / aria roles — if you navigated to a route that does not exist, the snapshot will say so; if a locator timed out, the actual DOM is in the snapshot. Adjust selectors / navigation accordingly. Do NOT repeat the previous attempt's selectors or routes verbatim."
              if [ -n "$ERROR_MSG" ]; then
                REASON+=$'\n\nFirst Playwright error:\n'"$ERROR_MSG"
              fi
              REASON+="$ERROR_CTX"
              echo "regression — retrying with error context (length=${#REASON})"
              ;;
            *)
              if [ "$EVIDENCE" != "missing" ] && [ "$EVIDENCE" != "undetermined" ]; then
                echo "verdict=$VERDICT evidence=$EVIDENCE — no retry needed"
                exit 0
              fi
              REASON=$(jq -r '.evidenceReasoning // ""' "$RESULT")
              echo "evidence $EVIDENCE — retrying with vision reasoning"
              ;;
          esac

          if ! yarn verify-pr-generate \
              --pr "$PR_NUMBER" \
              --force \
              --output "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts" \
              --retry-context "$REASON"; then
            echo "retry verify-pr-generate failed — keeping original verdict"
            exit 0
          fi

          # shellcheck disable=SC2012
          BUNDLE=$(ls -t .verify-output/*/prompt-bundle.json | head -1)
          if ! yarn verify-pr-author --bundle "$BUNDLE"; then
            echo "retry verify-pr-author failed — keeping original verdict"
            exit 0
          fi

          # Sub-shell so set -e here doesn't kill the outer step on regression.
          # Strip secrets from env: this invocation runs the agent-emitted
          # spec (untrusted), so GITHUB_TOKEN / GH_TOKEN / ANTHROPIC_API_KEY
          # must not be visible to the subprocess. The trusted scripts
          # above (verify-pr-generate, verify-pr-author) still see them
          # because env -u only strips for this single command. srt wraps
          # the actual recipe execution for Layer-2 FS + network jail.
          ( cd "$PR_HEAD_DIR" && env -u GITHUB_TOKEN -u GH_TOKEN -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN \
              srt --settings "$SRT_SETTINGS" \
              yarn verify-pr --recipe-spec ".verify-recipes/pr-${PR_NUMBER}.spec.ts" ) || \
            echo "retry verify-pr exited non-zero — evidence-check will still run if verdict==verified"

          # shellcheck disable=SC2012
          NEW_RESULT=$(ls -t "$PR_HEAD_DIR"/.verify-output/*/verify-result.json | head -1)
          if [ "$NEW_RESULT" = "$RESULT" ]; then
            echo "retry produced no new verify-result.json — keeping original verdict"
            exit 0
          fi
          # Annotate the new result so downstream observers know this came
          # from the retry loop.
          jq '. + {evidenceRetry: true}' "$NEW_RESULT" > "$NEW_RESULT.tmp" && mv "$NEW_RESULT.tmp" "$NEW_RESULT"

          # Evidence-check only meaningful on a verified verdict; on
          # regression the screenshots typically don't capture the change.
          NEW_VERDICT=$(jq -r '.verdict' "$NEW_RESULT")
          if [ "$NEW_VERDICT" = "verified" ]; then
            yarn verify-evidence-check \
              --result "$NEW_RESULT" \
              --diff /tmp/pr.diff \
              --recipe "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts" || true
          fi

          FINAL_EVIDENCE=$(jq -r '.evidenceVerdict // "n/a"' "$NEW_RESULT")
          echo "retry complete — final verdict=$NEW_VERDICT evidence=$FINAL_EVIDENCE"

      - name: Run PR-added unit tests
        # Complementary verification signal: when the PR ships its own
        # *.test.{ts,tsx,…} alongside the diff (e.g. PR #16 added
        # HighlightStyles.test.tsx), run them via vitest. Result is folded
        # into verify-result.json under `unitTests` — Playwright + unit
        # tests together give reviewers AND/OR confidence the diff works.
        # This step does NOT change the existing verdict; the comment
        # renders unit-test status alongside the Playwright verdict so
        # they're visible together. A regression in unit tests but a
        # verified Playwright recipe (or vice versa) is informative on
        # its own.
        if: always()
        working-directory: ${{ runner.temp }}/pr-head
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NX_NO_CLOUD: 'true'
          NX_CLOUD_ACCESS_TOKEN: ''
        run: |
          set -euo pipefail
          # Layer-1 security: PR-added test files are agent / contributor
          # content, untrusted under pull_request_target. Strip secrets so
          # a malicious test file can't read GITHUB_TOKEN /
          # ANTHROPIC_API_KEY from env. This step doesn't need either.
          unset GITHUB_TOKEN GH_TOKEN ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN
          if ! compgen -G "$PR_HEAD_DIR/.verify-output/*/verify-result.json" >/dev/null; then
            echo "no verify-result.json — skipping unit-test step"
            exit 0
          fi
          RESULT=$(ls -t "$PR_HEAD_DIR"/.verify-output/*/verify-result.json | head -1)

          # Extract added/modified test files from the captured PR diff.
          # Pattern matches `*.test.*` and `*.spec.*` under code/ — wide
          # enough to catch component / utility tests; the workflow has
          # already declined to run if the PR comment label gate was off.
          TEST_FILES=()
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            TEST_FILES+=("$f")
          done < <(
            grep -E '^\+\+\+ b/code/.+\.(test|spec)\.(ts|tsx|js|jsx)$' /tmp/pr.diff 2>/dev/null \
              | sed 's|^+++ b/||' \
              | sort -u
          )

          if [ ${#TEST_FILES[@]} -eq 0 ]; then
            echo "no PR-added unit tests detected — recording n/a"
            jq '. + {unitTests: {ran: false, files: [], passed: null, summary: "no PR-added test files in diff"}}' \
              "$RESULT" > "$RESULT.tmp" && mv "$RESULT.tmp" "$RESULT"
            exit 0
          fi

          echo "running ${#TEST_FILES[@]} unit test file(s): ${TEST_FILES[*]}"
          REPORT="$RUNNER_TEMP/unit-tests-report.json"

          # Vitest emits a JSON reporter file when --reporter=json is set.
          # `set -e` is off for this block so vitest exit codes don't kill
          # the step; we surface the verdict via JSON inspection.
          set +e
          yarn vitest run --reporter=json --outputFile "$REPORT" "${TEST_FILES[@]}" > /tmp/vitest.log 2>&1
          VITEST_EXIT=$?
          set -e

          if [ -f "$REPORT" ]; then
            PASSED=$(jq '.numFailedTests == 0 and .numFailedTestSuites == 0' "$REPORT")
            SUMMARY=$(jq -r '"\(.numPassedTests) passed, \(.numFailedTests) failed across \(.numTotalTestSuites) suite(s)"' "$REPORT")
          else
            PASSED=false
            SUMMARY="vitest exited $VITEST_EXIT without writing a JSON report (likely setup error); see Action log"
          fi
          # Capture the tail of vitest stdout so the comment can show
          # readable failure output (ANSI-stripped).
          DETAILS=$(tail -c 4000 /tmp/vitest.log | tr -d '\000' \
            | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' | jq -Rs .)

          jq \
            --argjson passed "$PASSED" \
            --arg summary "$SUMMARY" \
            --argjson files "$(printf '%s\n' "${TEST_FILES[@]}" | jq -R . | jq -s .)" \
            --argjson details "$DETAILS" \
            '. + {unitTests: {ran: true, files: $files, passed: $passed, summary: $summary, details: $details}}' \
            "$RESULT" > "$RESULT.tmp" && mv "$RESULT.tmp" "$RESULT"
          echo "unit-tests verdict: $SUMMARY (passed=$PASSED, exit=$VITEST_EXIT)"

      - name: Read verdict
        id: verdict
        if: always()
        run: |
          set -euo pipefail
          RESULT=""
          if compgen -G "$PR_HEAD_DIR/.verify-output/*/verify-result.json" >/dev/null; then
            RESULT=$(ls -t "$PR_HEAD_DIR"/.verify-output/*/verify-result.json | head -1)
          fi
          if [ -n "$RESULT" ]; then
            VERDICT=$(jq -r '.verdict' "$RESULT")
            UNIT_RAN=$(jq -r '.unitTests.ran // false' "$RESULT")
            UNIT_PASSED=$(jq -r '.unitTests.passed // null' "$RESULT")
            REGRESSION_REASON=$(jq -r '.regressionReason // ""' "$RESULT")
            # Fill in a regressionReason when Playwright failed but verify-pr
            # didn't populate one (compile-failure stubs already set their
            # own reason). Extract the failed test name + first error from
            # playwright-report.json — reviewers see WHY without needing
            # the trace.zip.
            if [ "$VERDICT" = "regression" ] && [ -z "$REGRESSION_REASON" ]; then
              RUN_DIR=$(dirname "$RESULT")
              REPORT="$RUN_DIR/playwright-report.json"
              if [ -f "$REPORT" ]; then
                # `.suites[].specs[].title` is the canonical test name in
                # Playwright's JSON reporter. Fall back to `.title` on nested
                # objects when the structure varies.
                DERIVED=$(jq -r '
                  [.. | objects | select(has("errors") and (.errors | length > 0))] as $failed
                  | [.. | objects | select(has("title") and has("ok") and .ok == false) | .title] as $titles_alt
                  | (($failed | map(.title // empty) + $titles_alt) | unique | map(select(. != "" and . != null)) | .[0:3] | join("; ")) as $titles
                  | ($failed | .[0].errors[0] | (.message // .stack // tostring)) as $err
                  | "Playwright assertion failed in: \( if $titles == "" then "?" else $titles end ) — \($err | gsub("\n"; " ") | .[0:400])"
                ' "$REPORT" 2>/dev/null || true)
                # Strip ANSI escape sequences — Playwright's expect()
                # message embeds raw colour codes that render as ^[[2m
                # / ^[[31m noise in the PR comment.
                DERIVED=$(printf '%s' "$DERIVED" | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g')
                if [ -n "$DERIVED" ] && [ "$DERIVED" != "null" ] && [ "$DERIVED" != "Playwright assertion failed in:  — null" ]; then
                  jq --arg reason "$DERIVED" '. + {regressionReason: $reason}' \
                    "$RESULT" > "$RESULT.tmp" && mv "$RESULT.tmp" "$RESULT"
                  echo "derived regressionReason: $DERIVED"
                fi
              fi
            fi
            # Compose final verdict from AND of Playwright + unit tests.
            # If Playwright already says regression we keep it (Playwright
            # failure is authoritative). If Playwright passed BUT unit tests
            # ran and failed, downgrade to regression and annotate the
            # regressionReason so the comment + red-CI signal reflect it.
            if [ "$VERDICT" = "verified" ] && [ "$UNIT_RAN" = "true" ] && [ "$UNIT_PASSED" = "false" ]; then
              VERDICT="regression"
              jq '. + {verdict: "regression", regressionReason: (.regressionReason // "PR-added unit tests failed (see unitTests.details)")}' \
                "$RESULT" > "$RESULT.tmp" && mv "$RESULT.tmp" "$RESULT"
              echo "verdict downgraded: Playwright verified but unit tests failed → regression"
            fi
            echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
            echo "verdict: $VERDICT" >> "$GITHUB_STEP_SUMMARY"
            jq -r '"target=\(.template) regressionReason=\(.regressionReason // "n/a")"' "$RESULT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "verdict=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply verified-by-harness label
        if: steps.verdict.outputs.verdict == 'verified'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ensure the label exists on the repo (idempotent — `gh label create`
          # exits non-zero if the label already exists, which we swallow).
          gh label create verified-by-harness \
            --repo ${{ github.repository }} \
            --description "Verified by PR Verify Harness" \
            --color 0E8A16 \
            2>/dev/null || true
          gh pr edit ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --add-label verified-by-harness

      - name: Push screenshots to side branch
        id: screenshots
        if: always() && steps.verdict.outputs.verdict != '' && steps.verdict.outputs.verdict != 'missing'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          SOURCE="$PR_HEAD_DIR/.verify-output"
          if ! find "$SOURCE" -name '*.png' -print -quit | grep -q .; then
            echo "no screenshots produced — skipping side-branch push"
            echo "urls=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ASSETS_DIR="$RUNNER_TEMP/verify-assets"
          AUTH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          # Try cloning the existing side branch; if it doesn't exist yet,
          # create an orphan branch with a single empty commit.
          if git -c protocol.version=2 clone --depth 1 --branch _verify-screenshots \
              "$AUTH_URL" "$ASSETS_DIR" 2>/dev/null; then
            echo "cloned existing _verify-screenshots branch"
          else
            echo "side branch missing — creating orphan _verify-screenshots"
            git -c protocol.version=2 clone --depth 1 "$AUTH_URL" "$ASSETS_DIR"
            (
              cd "$ASSETS_DIR"
              git -c user.email=actions@github.com -c user.name="github-actions[bot]" \
                checkout --orphan _verify-screenshots
              git rm -rf . >/dev/null
              echo "Verify harness screenshot store. Auto-managed; do not edit." > README.md
              git add README.md
              git -c user.email=actions@github.com -c user.name="github-actions[bot]" \
                commit -m "chore: init _verify-screenshots branch"
              git push origin _verify-screenshots
            )
          fi

          PR_DIR="$ASSETS_DIR/pr-${PR_NUMBER}/${RUN_ID}"
          rm -rf "$ASSETS_DIR/pr-${PR_NUMBER}/${RUN_ID}"
          mkdir -p "$PR_DIR"

          # Copy each runId/<spec-slug>/<file>.png preserving the structure
          # under the run directory.
          (
            cd "$SOURCE"
            find . -name '*.png' -print0
          ) | while IFS= read -r -d '' rel; do
            dest="$PR_DIR/${rel#./}"
            mkdir -p "$(dirname "$dest")"
            cp "$SOURCE/$rel" "$dest"
          done

          cd "$ASSETS_DIR"
          git add "pr-${PR_NUMBER}/${RUN_ID}"
          if git diff --cached --quiet; then
            echo "no new screenshots to commit"
            echo "urls=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.email=actions@github.com -c user.name="github-actions[bot]" \
            commit -m "verify: PR #${PR_NUMBER} run ${RUN_ID}"
          git push origin _verify-screenshots
          COMMIT_SHA=$(git rev-parse HEAD)

          # Emit JSON array of { rel, url } for each PNG, where url is the
          # raw.githubusercontent.com URL pinned at the commit we just pushed.
          URLS=$(
            cd "$ASSETS_DIR/pr-${PR_NUMBER}/${RUN_ID}"
            find . -name '*.png' \
              | sed "s|^\./||" \
              | jq -R --arg base "https://raw.githubusercontent.com/${REPO}/${COMMIT_SHA}/pr-${PR_NUMBER}/${RUN_ID}" \
                  '{ rel: ., url: ($base + "/" + .) }' \
              | jq -s .
          )
          echo "urls<<EOF" >> "$GITHUB_OUTPUT"
          echo "$URLS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Append telemetry
        # POST one row per run to a Google Apps Script web app that
        # appends to a Sheet (sheet schema: run_id, pr_number, verdict,
        # target, evidence_verdict, evidence_retry, unit_tests_ran,
        # unit_tests_passed, duration_ms, timestamp). After 10–20 PRs we
        # can answer: verified-first-try % vs after-retry vs regression,
        # vision false-negative rate, sandbox-path vs internal-ui
        # breakdown, duration distribution. Drives v8 prioritisation.
        #
        # No-ops when the webhook secrets aren't configured so forks
        # without telemetry sinks don't fail this step.
        if: always() && steps.verdict.outputs.verdict != '' && steps.verdict.outputs.verdict != 'missing'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          TELEMETRY_URL: ${{ secrets.TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_URL }}
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_AGENTIC_VERIFICATION_WEBHOOK_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TELEMETRY_URL:-}" ] || [ -z "${TELEMETRY_TOKEN:-}" ]; then
            echo "telemetry webhook not configured — skipping"
            exit 0
          fi
          if ! compgen -G "$PR_HEAD_DIR/.verify-output/*/verify-result.json" >/dev/null; then
            echo "no verify-result.json — skipping telemetry"
            exit 0
          fi
          # shellcheck disable=SC2012
          RESULT=$(ls -t "$PR_HEAD_DIR"/.verify-output/*/verify-result.json | head -1)

          # Aggregate token usage across every Claude dispatch in this
          # run — recipe-author (initial + retry) and evidence-check
          # (initial + retry-after-verified). Each call persists a
          # {model, usage, assistantText} JSON to its run dir via
          # agent-dispatch.ts / verify-evidence-check.ts. We glob all of
          # them and sum, then apply Anthropic's published per-million
          # token prices to get a dollar estimate. Costs are best-effort:
          # the price table is hardcoded so a price change requires a
          # workflow edit (Anthropic's pricing is stable enough that
          # this is acceptable for v8 prioritisation telemetry).
          # Dispatch artifacts land in two places:
          #   - recipe-author writes dispatch-response.json under
          #     $GITHUB_WORKSPACE/.verify-output (verify-pr-author runs
          #     from the trusted base checkout)
          #   - evidence-check writes evidence-check-response.json under
          #     $PR_HEAD_DIR/.verify-output (the result lives there)
          # Scan both.
          USAGE_FILES=()
          while IFS= read -r f; do
            [ -n "$f" ] && USAGE_FILES+=("$f")
          done < <(
            find "$PR_HEAD_DIR/.verify-output" "$GITHUB_WORKSPACE/.verify-output" -type f \
              \( -name 'dispatch-response.json' -o -name 'evidence-check-response.json' \) \
              2>/dev/null | sort
          )
          if [ ${#USAGE_FILES[@]} -eq 0 ]; then
            USAGE_JSON='{"input_tokens":0,"output_tokens":0,"cache_read_tokens":0,"cache_write_tokens":0,"cost_usd":"0.000000","dispatch_count":0}'
          else
            USAGE_JSON=$(jq -s '
              # USD per million tokens, current Anthropic pricing.
              #   i   = base input
              #   o   = output
              #   cr  = cache hits + refreshes (read)
              #   cw5 = 5-minute cache writes (SDK default)
              #   cw1 = 1-hour cache writes (extended cache)
              def prices:
                {
                  "claude-opus-4-7":    {"i": 5.00,  "o": 25.00, "cr": 0.50, "cw5": 6.25, "cw1": 10.00},
                  "claude-opus-4-6":    {"i": 5.00,  "o": 25.00, "cr": 0.50, "cw5": 6.25, "cw1": 10.00},
                  "claude-opus-4-5":    {"i": 5.00,  "o": 25.00, "cr": 0.50, "cw5": 6.25, "cw1": 10.00},
                  "claude-opus-4-1":    {"i": 15.00, "o": 75.00, "cr": 1.50, "cw5": 18.75, "cw1": 30.00},
                  "claude-opus-4":      {"i": 15.00, "o": 75.00, "cr": 1.50, "cw5": 18.75, "cw1": 30.00},
                  "claude-sonnet-4-6":  {"i": 3.00,  "o": 15.00, "cr": 0.30, "cw5": 3.75, "cw1": 6.00},
                  "claude-sonnet-4-5":  {"i": 3.00,  "o": 15.00, "cr": 0.30, "cw5": 3.75, "cw1": 6.00},
                  "claude-sonnet-4":    {"i": 3.00,  "o": 15.00, "cr": 0.30, "cw5": 3.75, "cw1": 6.00},
                  "claude-haiku-4-5":   {"i": 1.00,  "o": 5.00,  "cr": 0.10, "cw5": 1.25, "cw1": 2.00},
                  "claude-haiku-3-5":   {"i": 0.80,  "o": 4.00,  "cr": 0.08, "cw5": 1.00, "cw1": 1.60},
                  "claude-haiku-3":     {"i": 0.25,  "o": 1.25,  "cr": 0.03, "cw5": 0.30, "cw1": 0.50}
                };
              # Strip trailing -YYYYMMDD date suffix that Anthropic
              # ships alongside the rolling alias (e.g. claude-haiku-4-5
              # -20251001 → claude-haiku-4-5).
              def model_key($m):
                ($m // "") | sub("-2025[0-9]+$"; "") | sub("-2026[0-9]+$"; "");
              # Coerce any SDK field to a non-negative number. Anthropic
              # has shipped JSON shapes where a field that was previously
              # numeric becomes null (or even an object); without this
              # guard the arithmetic below blew up with "number and object
              # cannot be divided" on jq 1.6 / 1.7 even though jq 1.8
              # accepted it.
              def num($x):
                ($x | if type == "number" then . else 0 end);
              reduce .[] as $r (
                {input_tokens: 0, output_tokens: 0, cache_read_tokens: 0, cache_write_tokens: 0, cost_usd: 0, dispatch_count: 0};
                ($r.usage // {}) as $u
                | (prices[model_key($r.model)] // {"i":0,"o":0,"cr":0,"cw5":0,"cw1":0}) as $p
                # SDK exposes a breakdown under .cache_creation when extended
                # cache is enabled; otherwise the total lands in
                # .cache_creation_input_tokens and we charge it at the 5m rate
                # (the SDK default TTL).
                | (num($u.cache_creation.ephemeral_5m_input_tokens)) as $cw5_5m
                | (num($u.cache_creation_input_tokens)) as $cw5_legacy
                | (if $cw5_5m > 0 then $cw5_5m else $cw5_legacy end) as $cw5_tok
                | (num($u.cache_creation.ephemeral_1h_input_tokens)) as $cw1_tok
                | (num($u.input_tokens)) as $in_tok
                | (num($u.output_tokens)) as $out_tok
                | (num($u.cache_read_input_tokens)) as $cr_tok
                | (
                    $in_tok  * $p.i  +
                    $out_tok * $p.o  +
                    $cr_tok  * $p.cr +
                    $cw5_tok * $p.cw5 +
                    $cw1_tok * $p.cw1
                  ) / 1000000 as $c
                | {
                    input_tokens: (.input_tokens + $in_tok),
                    output_tokens: (.output_tokens + $out_tok),
                    cache_read_tokens: (.cache_read_tokens + $cr_tok),
                    cache_write_tokens: (.cache_write_tokens + $cw5_tok + $cw1_tok),
                    cost_usd: (.cost_usd + $c),
                    dispatch_count: (.dispatch_count + 1)
                  }
              )
              | .cost_usd |= (. * 1000000 | round / 1000000 | tostring)
            ' "${USAGE_FILES[@]}")
          fi
          echo "telemetry usage: $USAGE_JSON"

          PAYLOAD=$(jq -nc \
            --arg token "$TELEMETRY_TOKEN" \
            --arg run_id "$RUN_ID" \
            --arg pr "$PR_NUMBER" \
            --slurpfile result "$RESULT" \
            --argjson usage "$USAGE_JSON" '
              ($result[0]) as $r
              | {
                  token: $token,
                  run_id: $run_id,
                  pr_number: $pr,
                  verdict: $r.verdict,
                  target: ($r.template // "n/a"),
                  evidence_verdict: ($r.evidenceVerdict // "n/a"),
                  evidence_retry: (($r.evidenceRetry // false) | tostring),
                  unit_tests_ran: (($r.unitTests.ran // false) | tostring),
                  unit_tests_passed: (($r.unitTests.passed // "n/a") | tostring),
                  duration_ms: (($r.durations.totalMs // 0) | tostring),
                  input_tokens: ($usage.input_tokens | tostring),
                  output_tokens: ($usage.output_tokens | tostring),
                  cache_read_tokens: ($usage.cache_read_tokens | tostring),
                  cache_write_tokens: ($usage.cache_write_tokens | tostring),
                  cost_usd: $usage.cost_usd,
                  dispatch_count: ($usage.dispatch_count | tostring),
                  timestamp: ($r.createdAt // (now | todate))
                }
            ')
          # Log a token-redacted preview so the row is debuggable from
          # the Action log without leaking the shared secret.
          jq 'del(.token)' <<<"$PAYLOAD"

          # Apps Script /exec POST returns 302 → script.googleusercontent.com
          # /macros/echo where the response body lives. curl -L follows;
          # crucially we DO NOT pass -X POST — that flag forces the method
          # on EVERY request including the redirect, which makes the second
          # hop POST to /echo and 405s. --data-binary alone implies POST
          # for the first request, then curl downgrades to GET for the
          # redirect (RFC 7231 §6.4.3 default). -f makes non-2xx a hard
          # error. --max-time bounds the call.
          RESPONSE=$(curl -sS -fL --max-time 30 \
            -H 'Content-Type: application/json' \
            --data-binary "$PAYLOAD" \
            "$TELEMETRY_URL")
          echo "telemetry response: $RESPONSE"
          if ! jq -e '.ok == true' >/dev/null <<<"$RESPONSE"; then
            echo "telemetry rejected: $RESPONSE" >&2
            exit 1
          fi

      - name: Stage artifacts (rename dotdirs)
        # actions/upload-artifact v7 ships dotfiles into the zip, but
        # tools like macOS Finder + most unzippers hide them by default,
        # which makes the artifact look empty even though it is ~MBs.
        # Stage the contents under non-dot names so reviewers can browse
        # the zip without toggling hidden-file display.
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/verify-artifacts"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/runner-pr-head" "$STAGE/base"
          if [ -d "$PR_HEAD_DIR/.verify-output" ]; then
            cp -a "$PR_HEAD_DIR/.verify-output/." "$STAGE/runner-pr-head/verify-output/"
          fi
          if [ -d "$PR_HEAD_DIR/.verify-recipes" ]; then
            mkdir -p "$STAGE/runner-pr-head/verify-recipes"
            # Only include the materialised PR spec (trusted helpers
            # _util.ts + example-smoke.spec.ts live in the base copy).
            if [ -f "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts" ]; then
              cp "$PR_HEAD_DIR/.verify-recipes/pr-${PR_NUMBER}.spec.ts" \
                "$STAGE/runner-pr-head/verify-recipes/pr-${PR_NUMBER}.spec.ts"
            fi
          fi
          if [ -d "$GITHUB_WORKSPACE/.verify-output" ]; then
            cp -a "$GITHUB_WORKSPACE/.verify-output/." "$STAGE/base/verify-output/"
          fi
          echo "VERIFY_ARTIFACTS_DIR=$STAGE" >> "$GITHUB_ENV"
          # shellcheck disable=SC2012
          ls -la "$STAGE" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-output-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: ${{ env.VERIFY_ARTIFACTS_DIR }}/
          if-no-files-found: warn
          retention-days: 14
      - name: Post PR comment
        if: always()
        env:
          SCREENSHOT_URLS: ${{ steps.screenshots.outputs.urls }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            function renderScreenshots() {
              let raw = process.env.SCREENSHOT_URLS;
              if (!raw || raw.trim() === '' || raw.trim() === '[]') return '';
              let items;
              try {
                items = JSON.parse(raw);
              } catch {
                return '';
              }
              if (!Array.isArray(items) || items.length === 0) return '';
              const blocks = items.map(
                (it) => `### \`${it.rel}\`\n\n![${it.rel}](${it.url})\n`,
              );
              return `\n\n## Screenshots\n\n${blocks.join('\n')}`;
            }

            let body;
            try {
              const root = path.join(process.env.PR_HEAD_DIR || 'pr-head', '.verify-output');
              const dirs = fs.existsSync(root)
                ? fs.readdirSync(root, { withFileTypes: true })
                    .filter((d) => d.isDirectory())
                    .map((d) => d.name)
                    .sort()
                    .reverse()
                : [];
              const resultPath = dirs
                .map((d) => path.join(root, d, 'verify-result.json'))
                .find((p) => fs.existsSync(p));
              if (!resultPath) {
                body = `## Verify Harness\n\nNo verdict produced — the workflow failed before the harness ran (likely recipe-author dispatch, deny-regex, or lint). See [run log](${url}) for details.`;
              } else {
                const verdict = JSON.parse(fs.readFileSync(resultPath, 'utf-8'));
                const retrySuffix = verdict.evidenceRetry ? ' (after 1 retry)' : '';
                const evidenceLine = verdict.evidenceVerdict
                  ? `\n\nEvidence${retrySuffix} (vision-check, \`${verdict.evidenceModel ?? 'claude-haiku-4-5'}\`): \`${verdict.evidenceVerdict}\`${
                      verdict.evidenceReasoning
                        ? `\n\n<details><summary>Vision reasoning</summary>\n\n${verdict.evidenceReasoning}\n\n</details>`
                        : ''
                    }`
                  : '';
                const detailsBlock = verdict.regressionDetails
                  ? `\n\n<details><summary>Compile output (last 4KB)</summary>\n\n\`\`\`\n${String(verdict.regressionDetails).slice(0, 4000)}\n\`\`\`\n\n</details>`
                  : '';
                let unitTestsLine = '';
                if (verdict.unitTests && verdict.unitTests.ran) {
                  const status = verdict.unitTests.passed ? '✅ passed' : '❌ failed';
                  const filesList = (verdict.unitTests.files ?? [])
                    .map((f) => `\`${f}\``)
                    .join(', ');
                  unitTestsLine = `\n\nPR-added unit tests: ${status} — ${verdict.unitTests.summary || ''}${filesList ? `\n\nFiles: ${filesList}` : ''}`;
                  if (!verdict.unitTests.passed && verdict.unitTests.details) {
                    unitTestsLine += `\n\n<details><summary>vitest output (last 4KB)</summary>\n\n\`\`\`\n${String(verdict.unitTests.details).slice(0, 4000)}\n\`\`\`\n\n</details>`;
                  }
                }
                body = `## Verify Harness\n\nVerdict: \`${verdict.verdict}\` (target \`${verdict.template}\`)${verdict.regressionReason ? `\n\nReason: \`${verdict.regressionReason}\`` : ''}${detailsBlock}${evidenceLine}${unitTestsLine}\n\nReplay: \`npx playwright show-trace\` on the trace.zip listed under "Artifacts" on the [run summary page](${url}).${renderScreenshots()}`;
              }
            } catch (err) {
              body = `## Verify Harness\n\nError reading verdict: \`${err.message}\`. See [run log](${url}).`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if final verdict is regression
        # Preserve red-CI signal. Earlier Verify-PR step swallows non-zero
        # exit so retry can run; this terminal gate restores the fail
        # signal based on the post-retry verdict.
        if: always() && steps.verdict.outputs.verdict == 'regression'
        run: |
          echo "Final verdict: regression — failing job."
          exit 1
